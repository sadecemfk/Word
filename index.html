<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kantar Yönetim Sistemi</title>

    <!-- Tasarım Kütüphanesi -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React Kütüphaneleri -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- JSX Dönüştürücü -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Birebir A5 Fiş Tasarımı (Tam Köşeli & Keskin Hatlar) */
        .a5-ticket {
            border: 1px solid #000000;
            border-radius: 0px !important;
            padding: 14px 18px;
            background: #ffffff;
            color: #0f172a;
            font-family: Arial, Helvetica, sans-serif;
            box-sizing: border-box;
        }

        .a5-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 6px;
            margin-bottom: 6px;
        }

        .a5-table th, .a5-table td {
            border: 1px solid #64748b;
            padding: 6px 10px;
            font-size: 13px;
            border-radius: 0px !important;
        }

        .a5-table th {
            background-color: #f1f5f9;
            font-weight: 700;
            text-align: left;
            color: #1e293b;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body class="bg-gray-200">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- İKONLAR ---
        const IconTruck = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M10 17h4V5H2v12h3"/><path d="M20 17h2v-9h-4.5L14 5h-4"/><path d="M14 17h1"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>;
        const IconSettings = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
        const IconEdit3 = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>;
        const IconX = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
        const IconPlus = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
        const IconTrash2 = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>;
        const IconRefreshCw = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>;
        const IconDownload = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
        const IconPrinter = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>;
        const IconFileText = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>;
        const IconScale = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></svg>;
        const IconLock = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>;
        const IconShieldCheck = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>;

        // HAFTALIK LİSANS HESAPLAMA ALGORİTMASI
        const getExpectedWeeklyLicenseKey = (dateObj = new Date()) => {
            const day = dateObj.getDate();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');

            let week = '01';
            if (day > 21) week = '04';
            else if (day > 14) week = '03';
            else if (day > 7) week = '02';
            else week = '01';

            return `${week}${month}`;
        };

        function App() {
            // Lisans State'leri
            const [isAuthorized, setIsAuthorized] = useState(false);
            const [licenseInput, setLicenseInput] = useState('');
            const [licenseError, setLicenseError] = useState('');

            // Zaman Yardımcıları
            const getNowDate = () => new Date();
            const formatDateForInput = (dateObj) => `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
            const formatTimeForInput = (dateObj) => `${String(dateObj.getHours()).padStart(2, '0')}:${String(dateObj.getMinutes()).padStart(2, '0')}`;
            const formatDateForPrint = (dateString) => dateString ? dateString.split('-').reverse().join('.') : '';

            // --- BASKI TİPİ (80mm fiş vs A4'e iki nüsha) ---
            const [printMode, setPrintMode] = useState('fis'); // 'fis' (80mm) | 'a4-copies'

            // --- ARAÇ & ŞOFÖR STATE'LERİ ---
            const [truckPlate, setTruckPlate] = useState('');
            const [trailerPlate, setTrailerPlate] = useState('');
            const [driver, setDriver] = useState('');

            // --- OPERATÖR SEÇİMİ ---
            const [kantarOp, setKantarOp] = useState('');
            const [kepceOp, setKepceOp] = useState('');

            // --- ÜRÜN SEÇİMİ ---
            const [urun, setUrun] = useState('');
            const [urunTuru, setUrunTuru] = useState('');

            // --- ZAMAN STATE'LERİ ---
            const [entryDate, setEntryDate] = useState('');
            const [entryTime, setEntryTime] = useState('');
            const [exitDate, setExitDate] = useState('');
            const [exitTime, setExitTime] = useState('');

            // --- MANUEL TARTIM GİRİŞİ ---
            const [daraInput, setDaraInput] = useState('');
            const [brutInput, setBrutInput] = useState('');
            const [docNoInput, setDocNoInput] = useState('');

            // --- OLUŞTURULAN FİŞ ---
            const [receipt, setReceipt] = useState(null);

            // --- AYARLAR & PRESET'LER ---
            const [showSettings, setShowSettings] = useState(false);
            const [newTruck, setNewTruck] = useState('');
            const [newTrailer, setNewTrailer] = useState('');
            const [newDriver, setNewDriver] = useState('');
            const [newKantarOp, setNewKantarOp] = useState('');
            const [newKepceOp, setNewKepceOp] = useState('');
            const [newProduct, setNewProduct] = useState('');
            const [newTypeInputs, setNewTypeInputs] = useState({});

            const [printFormat, setPrintFormat] = useState(null); // '80mm' | 'a4-copies'

            // Varsayılan kayıtlı araç (tek). Eski liste migrasyonla temizlenir.
            const PRESET_SEED_VERSION = '2';
            const defaultPresets = [
                { truck: "10MFK04", trailer: "10MFK14", driver: "Mert Fatih Küçükaslan" }
            ];

            const [presets, setPresets] = useState([]);

            // ==========================================
            // FİRMA KİMLİĞİ (logo + ad)
            // Logo "logo.png" olarak index.html ile ayni klasorde durur.
            // ==========================================
            const COMPANY_NAME = "GÖNSAN ENERJİ SAN. TİC. LTD. ŞTİ.";
            const COMPANY_LOGO = "logo.png";

            // ==========================================
            // ÜRÜN PORTFÖYÜ (ürün + türleri) — ayarlardan yönetilir
            // ==========================================
            const PRODUCTS_SEED_VERSION = '1';
            const defaultProducts = [
                { name: "KÖMÜR", types: ["TÜVENAN"] }
            ];
            const [products, setProducts] = useState(defaultProducts);

            // ==========================================
            // OPERATÖR VE İMZA TANIMLAMALARI
            // ==========================================
            const defaultKantarOperators = ["KANTAR1", "KANTAR2", "KANTAR3"];
            const defaultKepceOperators = ["LOD-1", "LOD-2", "LOD-3", "CSB-1", "SULO-1", "SULO-2", "SULO-3", "SULO-4"];

            const [kantarOperators, setKantarOperators] = useState(defaultKantarOperators);
            const [kepceOperators, setKepceOperators] = useState(defaultKepceOperators);

            // Operatör imza görselleri.
            // Bir operatöre imza resmi eklemek için: resmi "imzalar/" klasörüne koy
            // ve aşağıya operatör adı: "dosya yolu" şeklinde ekle. Örnek:
            //   "KANTAR1": "imzalar/kantar1.png",
            //   "LOD-1":   "imzalar/lod1.png"
            // Eşleme yoksa fişte kesik çizgili (ıslak imza) alanı görünür.
            const operatorImzalari = {
                // buraya kendi imza eşlemelerini ekle
            };

            useEffect(() => {
                // Lisans Otomatik Kontrol
                const expectedKey = getExpectedWeeklyLicenseKey();
                const savedLicense = localStorage.getItem('kantar_active_license');
                setIsAuthorized(savedLicense === expectedKey);

                setNow();

                const savedPresets = localStorage.getItem('kantarPresets');
                const savedPresetVersion = localStorage.getItem('kantarPresetsVersion');
                if (savedPresets && savedPresetVersion === PRESET_SEED_VERSION) {
                    // Kullanıcının güncel listesi (eklediği araçlar dahil) korunur
                    setPresets(JSON.parse(savedPresets));
                } else {
                    // İlk açılış veya eski sürüm: tek varsayılan araçla sıfırla
                    setPresets(defaultPresets);
                    localStorage.setItem('kantarPresets', JSON.stringify(defaultPresets));
                    localStorage.setItem('kantarPresetsVersion', PRESET_SEED_VERSION);
                }

                const savedKantarOps = localStorage.getItem('kantarKantarOps');
                const kOps = savedKantarOps ? JSON.parse(savedKantarOps) : defaultKantarOperators;
                setKantarOperators(kOps);
                setKantarOp(kOps[0] || '');

                const savedKepceOps = localStorage.getItem('kantarKepceOps');
                const keOps = savedKepceOps ? JSON.parse(savedKepceOps) : defaultKepceOperators;
                setKepceOperators(keOps);
                setKepceOp(keOps[0] || '');

                // Ürün portföyü
                const savedProducts = localStorage.getItem('kantarProducts');
                const savedProductsVersion = localStorage.getItem('kantarProductsVersion');
                let prods;
                if (savedProducts && savedProductsVersion === PRODUCTS_SEED_VERSION) {
                    prods = JSON.parse(savedProducts);
                } else {
                    prods = defaultProducts;
                    localStorage.setItem('kantarProducts', JSON.stringify(defaultProducts));
                    localStorage.setItem('kantarProductsVersion', PRODUCTS_SEED_VERSION);
                }
                setProducts(prods);
                setUrun(prods[0] ? prods[0].name : '');
                setUrunTuru(prods[0] && prods[0].types[0] ? prods[0].types[0] : '');

                // Sıradaki belge no
                setDocNoInput(String(getNextDocNo()));
            }, []);

            // Lisans Doğrulama
            const handleLicenseSubmit = (e) => {
                e.preventDefault();
                const expectedKey = getExpectedWeeklyLicenseKey();
                if (licenseInput.trim() === expectedKey) {
                    localStorage.setItem('kantar_active_license', expectedKey);
                    setIsAuthorized(true);
                    setLicenseError('');
                    setLicenseInput('');
                } else {
                    setLicenseError('Girdiğiniz kod hatalı!');
                }
            };

            const handleLogoutLicense = () => {
                localStorage.removeItem('kantar_active_license');
                setIsAuthorized(false);
            };

            // Otomatik Yazdırma Tetikleyici
            useEffect(() => {
                if (printFormat) {
                    const timer = setTimeout(() => window.print(), 300);
                    const handleAfterPrint = () => setPrintFormat(null);
                    window.addEventListener('afterprint', handleAfterPrint);
                    return () => {
                        clearTimeout(timer);
                        window.removeEventListener('afterprint', handleAfterPrint);
                    };
                }
            }, [printFormat]);

            const setNow = () => {
                const now = getNowDate();
                setEntryDate(formatDateForInput(now));
                setEntryTime(formatTimeForInput(now));
                setExitDate(formatDateForInput(now));
                setExitTime(formatTimeForInput(now));
            };

            // Sıralı belge numarası (localStorage) — uydurma değil, artan sayaç
            const getNextDocNo = () => {
                const last = parseInt(localStorage.getItem('kantar_last_docno') || '0', 10);
                return (isNaN(last) ? 0 : last) + 1;
            };

            const updatePresetsInStorage = (newPresets) => {
                setPresets(newPresets);
                localStorage.setItem('kantarPresets', JSON.stringify(newPresets));
            };

            const handlePresetSelect = (preset) => {
                setTruckPlate(preset.truck);
                setTrailerPlate(preset.trailer);
                setDriver(preset.driver);
                setReceipt(null);
            };

            const handleAddPreset = () => {
                if (newTruck.trim()) {
                    const updatedList = [...presets, {
                        truck: newTruck.toUpperCase(),
                        trailer: newTrailer.toUpperCase(),
                        driver: newDriver
                    }];
                    updatePresetsInStorage(updatedList);
                    setNewTruck(''); setNewTrailer(''); setNewDriver('');
                }
            };

            const handleDeletePreset = (index) => {
                updatePresetsInStorage(presets.filter((_, i) => i !== index));
            };

            // Operatör ekle / sil
            const handleAddKantarOp = () => {
                if (newKantarOp.trim()) {
                    const list = [...kantarOperators, newKantarOp.trim().toUpperCase()];
                    setKantarOperators(list);
                    localStorage.setItem('kantarKantarOps', JSON.stringify(list));
                    setNewKantarOp('');
                }
            };
            const handleDeleteKantarOp = (idx) => {
                const list = kantarOperators.filter((_, i) => i !== idx);
                setKantarOperators(list);
                localStorage.setItem('kantarKantarOps', JSON.stringify(list));
                if (!list.includes(kantarOp)) setKantarOp(list[0] || '');
            };
            const handleAddKepceOp = () => {
                if (newKepceOp.trim()) {
                    const list = [...kepceOperators, newKepceOp.trim().toUpperCase()];
                    setKepceOperators(list);
                    localStorage.setItem('kantarKepceOps', JSON.stringify(list));
                    setNewKepceOp('');
                }
            };
            const handleDeleteKepceOp = (idx) => {
                const list = kepceOperators.filter((_, i) => i !== idx);
                setKepceOperators(list);
                localStorage.setItem('kantarKepceOps', JSON.stringify(list));
                if (!list.includes(kepceOp)) setKepceOp(list[0] || '');
            };

            // Ürün / ürün türü ekle-sil (portföy yönetimi)
            const updateProductsInStorage = (list) => {
                setProducts(list);
                localStorage.setItem('kantarProducts', JSON.stringify(list));
            };
            const handleProductSelect = (name) => {
                setUrun(name);
                const p = products.find(x => x.name === name);
                setUrunTuru(p && p.types[0] ? p.types[0] : '');
                setReceipt(null);
            };
            const handleAddProduct = () => {
                const name = newProduct.trim().toUpperCase();
                if (name && !products.some(p => p.name === name)) {
                    updateProductsInStorage([...products, { name, types: [] }]);
                    setNewProduct('');
                }
            };
            const handleDeleteProduct = (idx) => {
                const list = products.filter((_, i) => i !== idx);
                updateProductsInStorage(list);
                if (!list.some(p => p.name === urun)) {
                    const first = list[0];
                    setUrun(first ? first.name : '');
                    setUrunTuru(first && first.types[0] ? first.types[0] : '');
                }
            };
            const handleAddType = (productIdx) => {
                const pname = products[productIdx].name;
                const t = (newTypeInputs[pname] || '').trim().toUpperCase();
                if (!t || products[productIdx].types.includes(t)) return;
                const list = products.map((p, i) => i === productIdx ? { ...p, types: [...p.types, t] } : p);
                updateProductsInStorage(list);
                setNewTypeInputs({ ...newTypeInputs, [pname]: '' });
                if (products[productIdx].name === urun && !urunTuru) setUrunTuru(t);
            };
            const handleDeleteType = (productIdx, typeIdx) => {
                const list = products.map((p, i) => i === productIdx ? { ...p, types: p.types.filter((_, ti) => ti !== typeIdx) } : p);
                updateProductsInStorage(list);
                const cur = list[productIdx];
                if (cur && cur.name === urun && !cur.types.includes(urunTuru)) {
                    setUrunTuru(cur.types[0] || '');
                }
            };
            const currentTypes = (products.find(p => p.name === urun) || {}).types || [];

            // --- FİŞ OLUŞTURMA (MANUEL TARTIM) ---
            const dara = parseInt(daraInput, 10);
            const brut = parseInt(brutInput, 10);
            const hasValidWeights = !isNaN(dara) && !isNaN(brut);
            const netPreview = hasValidWeights ? brut - dara : null;

            const isReadyToWeigh = truckPlate.trim().length > 0 && hasValidWeights && netPreview > 0;

            const createReceipt = () => {
                if (!isReadyToWeigh) return;
                const docNo = parseInt(docNoInput, 10) || getNextDocNo();
                localStorage.setItem('kantar_last_docno', String(docNo));
                setReceipt({
                    docNo,
                    dara,
                    brut,
                    net: brut - dara,
                    kantarOp,
                    kepceOp,
                    urun,
                    urunTuru
                });
                setDocNoInput(String(docNo + 1));
            };

            const formattedEntryDate = formatDateForPrint(entryDate);
            const formattedExitDate = formatDateForPrint(exitDate);

            // ==========================================
            // LİSANS KİLİT EKRANI
            // ==========================================
            if (!isAuthorized) {
                return (
                    <div className="min-h-screen bg-slate-900 text-white flex items-center justify-center p-4 font-sans">
                        <div className="bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-8 max-w-md w-full text-center relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500"></div>
                            <div className="w-16 h-16 bg-indigo-500/10 text-indigo-400 rounded-full flex items-center justify-center mx-auto mb-4 border border-indigo-500/20">
                                <IconLock size={32} />
                            </div>
                            <h2 className="text-2xl font-black text-white tracking-wide">KANTAR YÖNETİM SİSTEMİ</h2>

                                <div className="text-xs font-bold text-indigo-900 uppercase tracking-wider mb-2">Baskı Tipini Seçin</div>
                                <div className="grid grid-cols-2 gap-2">
                                    <button onClick={() => setPrintMode('fis')} className={`py-2 px-3 rounded-lg font-bold text-sm transition-all border ${printMode === 'fis' ? 'bg-indigo-600 text-white border-indigo-700 shadow-md' : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-100'}`}>📄 Fiş Çıktısı (80mm)</button>
                                    <button onClick={() => setPrintMode('a4-copies')} className={`py-2 px-3 rounded-lg font-bold text-sm transition-all border ${printMode === 'a4-copies' ? 'bg-indigo-600 text-white border-indigo-700 shadow-md' : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-100'}`}>📑 A4 İki Nüsha</button>
                                </div>
                                <p className="text-[11px] text-indigo-700 mt-2">A4 iki nüsha = aynı fişin firma + şoför nüshası tek sayfada.</p>
                            </div>

                            {/* ARAÇ VE ŞOFÖR SEÇİMİ */}
                            <div className="bg-blue-50 p-4 rounded-lg border border-blue-100">
                                <div className="flex justify-between items-center mb-3">
                                    <h2 className="text-md font-semibold text-blue-800 flex items-center"><IconTruck className="mr-2" size={18}/> Araç ve Şoför Bilgileri</h2>
                                </div>
                                <div className="mb-4">
                                    <div className="text-xs text-gray-500 font-bold mb-2 uppercase tracking-wider">Hızlı Seçim (Tıkla ve Doldur)</div>
                                    {presets.length === 0 ? (
                                        <div className="p-3 bg-white border border-dashed rounded text-sm text-gray-500 text-center">Araç bulunmuyor.</div>
                                    ) : (
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-48 overflow-y-auto pr-1">
                                            {presets.map((preset, idx) => (
                                                <button key={idx} onClick={() => handlePresetSelect(preset)} className={`py-2 px-3 rounded-lg border text-left font-bold transition-all flex flex-col justify-center ${truckPlate === preset.truck ? 'bg-blue-600 border-blue-700 text-white shadow-md' : 'bg-white border-gray-300 text-gray-700 hover:bg-gray-50'}`}>
                                                    <span className="text-sm">{preset.truck}</span>
                                                    <span className={`text-[10px] uppercase font-normal mt-1 ${truckPlate === preset.truck ? 'text-blue-100' : 'text-gray-500'}`}>{preset.driver}</span>
                                                </button>
                                            ))}
                                        </div>
                                    )}
                                </div>
                                <div className="pt-3 border-t border-blue-200">
                                    <div className="text-xs text-gray-500 font-bold mb-3 uppercase tracking-wider flex items-center"><IconEdit3 size={14} className="mr-1"/> Manuel Giriş / Düzenleme</div>
                                    <div className="space-y-3">
                                        <div className="flex items-center"><label className="w-28 text-sm text-gray-700 font-semibold">Çekici Plaka:</label><input type="text" value={truckPlate} onChange={(e) => { setTruckPlate(e.target.value.toUpperCase()); setReceipt(null); }} className="flex-1 p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 uppercase font-bold" placeholder="Örn: 10AAY560"/></div>
                                        <div className="flex items-center"><label className="w-28 text-sm text-gray-700 font-semibold">Dorse Plaka:</label><input type="text" value={trailerPlate} onChange={(e) => { setTrailerPlate(e.target.value.toUpperCase()); setReceipt(null); }} className="flex-1 p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 uppercase font-bold" placeholder="Örn: 10AAY561"/></div>
                                        <div className="flex items-center"><label className="w-28 text-sm text-gray-700 font-semibold">Şoför:</label><input type="text" value={driver} onChange={(e) => { setDriver(e.target.value); setReceipt(null); }} className="flex-1 p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500" placeholder="Ad Soyad Giriniz"/></div>
                                    </div>
                                </div>
                            </div>

                            {/* ÜRÜN SEÇİMİ */}
                            <div className="bg-orange-50 p-4 rounded-lg border border-orange-200">
                                <h2 className="text-md font-semibold text-orange-800 mb-3">Ürün Bilgisi</h2>
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="block text-xs font-bold text-gray-500 uppercase mb-1">Ürün</label>
                                        <select value={urun} onChange={(e) => handleProductSelect(e.target.value)} className="w-full p-2 border rounded focus:ring-2 focus:ring-orange-500 font-semibold bg-white">
                                            {products.length === 0 && <option value="">—</option>}
                                            {products.map((p, i) => <option key={i} value={p.name}>{p.name}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-500 uppercase mb-1">Ürün Türü</label>
                                        <select value={urunTuru} onChange={(e) => { setUrunTuru(e.target.value); setReceipt(null); }} className="w-full p-2 border rounded focus:ring-2 focus:ring-orange-500 font-semibold bg-white">
                                            {currentTypes.length === 0 && <option value="">—</option>}
                                            {currentTypes.map((t, i) => <option key={i} value={t}>{t}</option>)}
                                        </select>
                                    </div>
                                </div>
                                <p className="text-[11px] text-orange-700 mt-2">Ürün ve türlerini "Araç Yönetimi" ekranından ekleyip çıkarabilirsin.</p>
                            </div>

                            {/* OPERATÖR SEÇİMİ */}
                            <div className="bg-amber-50 p-4 rounded-lg border border-amber-200">
                                <h2 className="text-md font-semibold text-amber-800 mb-3">Operatör Seçimi</h2>
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="block text-xs font-bold text-gray-500 uppercase mb-1">Kantarcı</label>
                                        <select value={kantarOp} onChange={(e) => { setKantarOp(e.target.value); setReceipt(null); }} className="w-full p-2 border rounded focus:ring-2 focus:ring-amber-500 font-semibold bg-white">
                                            {kantarOperators.map((op, i) => <option key={i} value={op}>{op}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-500 uppercase mb-1">Kepçe Operatörü</label>
                                        <select value={kepceOp} onChange={(e) => { setKepceOp(e.target.value); setReceipt(null); }} className="w-full p-2 border rounded focus:ring-2 focus:ring-amber-500 font-semibold bg-white">
                                            {kepceOperators.map((op, i) => <option key={i} value={op}>{op}</option>)}
                                        </select>
                                    </div>
                                </div>
                            </div>

                            {/* ZAMAN BİLGİLERİ */}
                            <div className="bg-gray-50 p-4 rounded-lg border border-gray-200">
                                <div className="flex justify-between items-center mb-3">
                                    <h2 className="text-md font-semibold text-gray-700">Zaman Bilgileri:</h2>
                                    <button onClick={setNow} className="p-1.5 bg-gray-200 hover:bg-gray-300 rounded text-gray-700 flex items-center text-sm shadow-sm transition"><IconRefreshCw size={14} className="mr-1" /> Şimdiki Zaman</button>
                                </div>
                                <div className="space-y-4">
                                    <div className="p-3 bg-white border rounded shadow-sm">
                                        <div className="text-xs font-bold text-gray-500 uppercase mb-2">Giriş Zamanı (1. Tartım)</div>
                                        <div className="flex gap-2">
                                            <input type="date" value={entryDate} onChange={(e) => setEntryDate(e.target.value)} className="flex-1 p-2 border rounded focus:ring-2 focus:ring-blue-500 text-sm" />
                                            <input type="time" value={entryTime} onChange={(e) => setEntryTime(e.target.value)} className="w-32 p-2 border rounded focus:ring-2 focus:ring-blue-500 text-sm" />
                                        </div>
                                    </div>
                                    <div className="p-3 bg-white border rounded shadow-sm">
                                        <div className="text-xs font-bold text-gray-500 uppercase mb-2">Çıkış Zamanı (2. Tartım)</div>
                                        <div className="flex gap-2">
                                            <input type="date" value={exitDate} onChange={(e) => setExitDate(e.target.value)} className="flex-1 p-2 border rounded focus:ring-2 focus:ring-blue-500 text-sm" />
                                            <input type="time" value={exitTime} onChange={(e) => setExitTime(e.target.value)} className="w-32 p-2 border rounded focus:ring-2 focus:ring-blue-500 text-sm" />
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* MANUEL TARTIM GİRİŞİ */}
                            <div className="bg-green-50 p-4 rounded-lg border border-green-200">
                                <h2 className="text-md font-semibold text-green-800 mb-3 flex items-center"><IconScale className="mr-2" size={18}/> Tartım Girişi (Manuel)</h2>
                                <div className="grid grid-cols-2 gap-3 mb-3">
                                    <div>
                                        <label className="block text-xs font-bold text-gray-500 uppercase mb-1">1. Tartım (Dara) kg</label>
                                        <input type="number" inputMode="numeric" value={daraInput} onChange={(e) => { setDaraInput(e.target.value); setReceipt(null); }} className="w-full p-2 border rounded focus:ring-2 focus:ring-green-500 font-bold text-lg" placeholder="Örn: 14250" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-500 uppercase mb-1">2. Tartım (Brüt) kg</label>
                                        <input type="number" inputMode="numeric" value={brutInput} onChange={(e) => { setBrutInput(e.target.value); setReceipt(null); }} className="w-full p-2 border rounded focus:ring-2 focus:ring-green-500 font-bold text-lg" placeholder="Örn: 41700" />
                                    </div>
                                </div>
                                <div className="flex items-center justify-between gap-3">
                                    <div className="flex items-center gap-2">
                                        <label className="text-xs font-bold text-gray-500 uppercase">Belge No</label>
                                        <input type="number" value={docNoInput} onChange={(e) => setDocNoInput(e.target.value)} className="w-24 p-2 border rounded focus:ring-2 focus:ring-green-500 font-bold" />
                                    </div>
                                    <div className={`text-right px-3 py-2 rounded-lg border font-black text-lg ${netPreview === null ? 'bg-gray-100 text-gray-400 border-gray-200' : netPreview > 0 ? 'bg-white text-green-700 border-green-300' : 'bg-red-50 text-red-600 border-red-300'}`}>
                                        NET: {netPreview === null ? '—' : netPreview.toLocaleString('tr-TR') + ' kg'}
                                    </div>
                                </div>
                                {netPreview !== null && netPreview <= 0 && (
                                    <p className="text-xs text-red-600 mt-2 font-semibold">Brüt, daradan büyük olmalı (Net pozitif değil).</p>
                                )}
                            </div>

                            <div>
                                <button onClick={createReceipt} disabled={!isReadyToWeigh} className={`w-full py-4 rounded-xl text-lg font-bold text-white shadow-md flex justify-center items-center transition ${!isReadyToWeigh ? 'bg-gray-400 cursor-not-allowed' : 'bg-green-600 hover:bg-green-700 active:scale-[0.98]'}`}>
                                    <IconFileText className="mr-2" size={24} /> Fişi Oluştur / Önizle
                                </button>
                            </div>
                        </div>

                        {/* --- SAĞ FİŞ ÖNİZLEME SÜTUNU --- */}
                        <div className="lg:col-span-7 flex flex-col items-center justify-start bg-gray-100 p-6 rounded-lg border-2 border-dashed border-gray-300 min-h-[600px]">
                            <h3 className="text-gray-600 mb-4 font-bold text-base flex items-center">
                                <IconFileText size={20} className="mr-2 text-indigo-600" /> Fiş Önizlemesi
                            </h3>
                            {receipt ? (
                                <div className="w-full flex flex-col items-center">
                                    <div className="w-full max-w-[580px] bg-white p-4 shadow-xl rounded border border-gray-300">
                                        <RenderA5Ticket rcpt={receipt} isPreview={true} />
                                    </div>
                                    <div className="mt-6 w-full max-w-[580px] flex flex-col gap-2">
                                        {printMode === 'a4-copies' ? (
                                            <button onClick={() => setPrintFormat('a4-copies')} className="w-full py-4 bg-indigo-700 text-white font-bold text-base rounded-lg shadow-lg hover:bg-indigo-800 transition flex items-center justify-center active:scale-[0.98]">
                                                <IconDownload className="mr-2" size={22}/> A4 İki Nüsha Yazdır / PDF
                                            </button>
                                        ) : (
                                            <button onClick={() => setPrintFormat('80mm')} className="w-full py-4 bg-blue-600 text-white font-bold text-base rounded-lg shadow-lg hover:bg-blue-700 transition flex items-center justify-center active:scale-[0.98]"><IconDownload className="mr-2" size={22}/> 80mm Fiş Yazdır / PDF</button>
                                        )}
                                    </div>
                                </div>
                            ) : (
                                <div className="text-gray-400 flex flex-col items-center justify-center h-full my-auto text-center p-8">
                                    <IconPrinter size={64} className="mb-3 opacity-40" />
                                    <p className="text-lg font-semibold text-gray-500">Fiş Önizlemesi</p>
                                    <p className="text-sm mt-1">Araç/şoför ve operatörü seçin, dara ile brüt değerlerini girin, ardından <b>"Fişi Oluştur / Önizle"</b> butonuna basın.</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
